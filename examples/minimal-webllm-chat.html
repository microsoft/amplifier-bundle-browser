<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amplifier + WebLLM Demo</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { 
            font-family: system-ui, sans-serif; 
            background: #1a1a2e; 
            color: #eee;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        #status { 
            padding: 20px; 
            text-align: center; 
            background: #16213e;
        }
        #progress-bar {
            width: 80%;
            max-width: 400px;
            height: 20px;
            margin: 10px auto;
            background: #0f3460;
            border-radius: 10px;
            overflow: hidden;
        }
        #progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #e94560, #ff6b6b);
            width: 0%;
            transition: width 0.3s;
        }
        #chat { flex: 1; display: flex; flex-direction: column; max-width: 800px; margin: 0 auto; width: 100%; padding: 20px; }
        #messages { flex: 1; overflow-y: auto; }
        .msg { margin: 10px 0; padding: 12px 16px; border-radius: 12px; max-width: 80%; }
        .user { background: #e94560; margin-left: auto; }
        .assistant { background: #16213e; }
        #input-row { display: flex; gap: 10px; padding: 10px 0; }
        #input { flex: 1; padding: 12px; border: none; border-radius: 8px; background: #16213e; color: #eee; font-size: 16px; }
        button { padding: 12px 24px; border: none; border-radius: 8px; background: #e94560; color: white; cursor: pointer; }
        button:disabled { opacity: 0.5; }
        .hidden { display: none; }
    </style>
</head>
<body>
    <div id="status">
        <h2>Loading Amplifier + WebLLM...</h2>
        <div id="progress-bar"><div id="progress-fill"></div></div>
        <p id="status-text">Initializing...</p>
    </div>
    
    <div id="chat" class="hidden">
        <div id="messages"></div>
        <div id="input-row">
            <input type="text" id="input" placeholder="Type a message..." />
            <button id="send">Send</button>
        </div>
    </div>

        async function init() {
            try {
                // 1. Load Pyodide
                progress(10, 'Loading Python runtime...');
                pyodide = await loadPyodide();
                await pyodide.loadPackage('micropip');

                // 2. Install dependencies + amplifier-core (with deps=False for PyYAML conflict)
                progress(25, 'Installing Amplifier...');
                const wheelB64 = $('amplifier-wheel-b64').textContent.trim();
                const wheelBytes = Uint8Array.from(atob(wheelB64), c => c.charCodeAt(0));
                pyodide.FS.writeFile('/tmp/amplifier_core-1.0.0-py3-none-any.whl', wheelBytes);
                
                // CRITICAL: Use Python for deps=False (JS proxy doesn't support kwargs)
                await pyodide.runPythonAsync(`
import micropip
await micropip.install(['pydantic', 'typing-extensions'])
await micropip.install('emfs:/tmp/amplifier_core-1.0.0-py3-none-any.whl', deps=False)
print("amplifier-core installed!")
`);

                // 3. Load WebLLM model
                progress(40, 'Loading AI model (may take a few minutes on first run)...');
                engine = await CreateMLCEngine(MODEL_ID, {
                    initProgressCallback: p => progress(40 + p.progress * 40, `Loading model: ${Math.round(p.progress * 100)}%`)
                });

                // 4. Set up JS bridge functions (BEFORE loading amplifier-browser)
                // MUST use globalThis - Python's `from js import X` looks in globalThis, NOT pyodide.globals
                progress(85, 'Setting up Amplifier session...');
                globalThis.js_llm_complete = async (messagesJson, toolsJson) => {
                    const messages = JSON.parse(messagesJson);
                    const response = await engine.chat.completions.create({ messages, temperature: 0.7, max_tokens: 1024 });
                    return JSON.stringify({ content: response.choices[0].message.content, usage: response.usage, finish_reason: response.choices[0].finish_reason });
                };
                globalThis.js_llm_stream = async (messagesJson, onChunk) => {
                    const messages = JSON.parse(messagesJson);
                    let fullContent = '';
                    const stream = await engine.chat.completions.create({ messages, temperature: 0.7, max_tokens: 1024, stream: true });
                    for await (const chunk of stream) {
                        const delta = chunk.choices[0]?.delta?.content || '';
                        fullContent += delta;
                        onChunk(delta);
                    }
                    return JSON.stringify({ content: fullContent, finish_reason: 'stop' });
                };
                globalThis.js_web_fetch = async (url) => {
                    try {
                        const r = await fetch(url, {
                            credentials: 'omit',
                            redirect: 'error',
                            referrerPolicy: 'no-referrer',
                        });
                        if (!r.ok) throw new Error(`HTTP ${r.status}: ${r.statusText}`);
                        return await r.text();
                    }
                    catch (e) { return `Error: ${e.message}`; }
                };

                // 5. Load amplifier-browser module and create session
                progress(90, 'Creating Amplifier session...');
                const browserB64 = $('amplifier-browser-py').textContent.trim();
                const browserCode = atob(browserB64);
                await pyodide.runPythonAsync(browserCode);
                
                await pyodide.runPythonAsync(`
session = create_session(model_id="${MODEL_ID}")
session.set_system_prompt("You are a helpful AI assistant running locally in the browser via WebGPU. Be concise and friendly.")
await session.initialize()
print("Amplifier session ready!")
`);

                // Ready!
                progress(100, 'Ready!');
                setTimeout(() => { $('status').classList.add('hidden'); $('chat').classList.remove('hidden'); $('input').focus(); }, 300);

            } catch (err) {
                console.error('Init error:', err);
                $('status-text').textContent = `Error: ${err.message}`;
                $('status-text').style.color = '#e94560';
            }
        }

        async function send() {
            const text = $('input').value.trim();
            if (!text) return;
            $('input').value = '';
            $('send').disabled = true;
            addMsg('user', text);
            
            try {
                const response = await pyodide.runPythonAsync(`await session.execute(${JSON.stringify(text)})`);
                addMsg('assistant', response);
            } catch (err) {
                addMsg('assistant', `Error: ${err.message}`);
            }
            $('send').disabled = false;
            $('input').focus();
        }

        $('send').addEventListener('click', send);
        $('input').addEventListener('keypress', e => { if (e.key === 'Enter') send(); });
        init();
    </script>
</body>
</html>
